name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build dap
        run: go build -o dist/dap ./cmd/dap

      - name: Build dap-daemon
        run: go build -o dist/dap-daemon ./cmd/dap-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dap-cli-go-${{ github.sha }}
          path: dist/
          if-no-files-found: error
